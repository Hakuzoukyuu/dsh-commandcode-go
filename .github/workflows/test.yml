name: test

# GitHub Actions is currently locked at the account level ("account is locked
# due to a billing issue"), so pushes cannot start a runner. Keep the workflow
# runnable on demand; switch `on:` back to push/pull_request once the lock is
# lifted.
on:
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
